name: gates

# Going Public item 5: pull_request (never pull_request_target).
# Fork PRs run with a read-only token and no access to repository secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # full history for the secret scan and identity check
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.22'
          cache: false
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.21.2 && echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Fetch all refs
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' || true
      - name: Prove every gate catches a planted failure
        run: REQUIRE_GITLEAKS=1 bash scripts/test-gates.sh
      - name: Run Going Public gates
        run: bash scripts/public-gates.sh
