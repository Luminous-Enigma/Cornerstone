name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: CLI smoke test (exit codes)
        run: |
          npx contrast check "#FFFFFF" "#101B44" --json
          if npx contrast check "#777777" "#FFFFFF" --json; then echo "an unreadable pair passed"; exit 1; fi
